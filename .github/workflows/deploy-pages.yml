name: Deploy WHOOP MG Lab to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Google OAuth configuration
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Configure the VITE_GOOGLE_CLIENT_ID repository secret before deploying."
            exit 1
          fi
          case "$VITE_GOOGLE_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "::error::VITE_GOOGLE_CLIENT_ID does not look like a Google OAuth Web Client ID."
              exit 1
              ;;
          esac

      - name: Verify
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
