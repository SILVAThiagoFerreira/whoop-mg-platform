    <g><rect x="76" y="210" width="210" height="154" rx="20" fill="#102431" stroke="#52D8FF" stroke-opacity="0.65"/><text x="106" y="258" fill="#52D8FF" font-size="31">▣</text><text x="106" y="304" fill="#FFFFFF" font-size="22" font-weight="800">WEB / PWA</text><text x="106" y="332" fill="#91AAB8" font-size="14">account workspace</text></g>
