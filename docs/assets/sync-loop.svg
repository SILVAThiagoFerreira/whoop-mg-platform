    <g><rect x="632" y="184" width="238" height="206" rx="22" fill="#18202B" stroke="#C6FF4A" stroke-width="2"/><text x="668" y="246" fill="#C6FF4A" font-size="31">◎</text><text x="668" y="294" fill="#FFFFFF" font-size="24" font-weight="800">ALIENWARE</text><text x="668" y="327" fill="#B7C7CE" font-size="15">canonical local copy</text><text x="668" y="356" fill="#8A9BA5" font-size="13">raw → processed → model</text></g>
