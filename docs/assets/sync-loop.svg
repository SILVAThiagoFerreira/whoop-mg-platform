<svg width="1500" height="560" viewBox="0 0 1500 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1500" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#081118"/><stop offset="1" stop-color="#12272A"/></linearGradient><linearGradient id="loop" x1="174" y1="276" x2="1300" y2="278" gradientUnits="userSpaceOnUse"><stop stop-color="#52D8FF"/><stop offset="0.5" stop-color="#B88BFF"/><stop offset="1" stop-color="#C6FF4A"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter></defs>
