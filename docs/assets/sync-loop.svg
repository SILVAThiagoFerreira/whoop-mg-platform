  <text x="70" y="72" fill="#C6FF4A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4">SYNC AS A REPLICA, NOT A DEPENDENCY</text>
  <text x="70" y="112" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">Like OneDrive — but with a local source of truth.</text>
